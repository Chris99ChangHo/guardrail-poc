# 가드레일 정책 — CLI(개발자)와 웹 UI(비개발자)가 같은 파일을 공유한다.
workspace: ./workspace          # 에이전트가 건드려도 되는 유일한 폴더

# 이 이름이 경로 어디에든 들어 있으면 🔴 차단
blocked_names: [".env", ".ssh", ".aws", ".gnupg"]

# 🔴 명령어에 이 문자열이 포함되면 즉시 차단
blocked_commands: ["rm -rf", "rm -fr", "mkfs", "shutdown", "printenv", ":(){", "chmod 777", "terraform destroy"]

# 🟡 사람이 승인해야 실행
ask_commands: ["rm", "mv", "pip install", "npm install", "curl", "wget", "git push", "terraform apply", "kubectl delete"]

# 🟢 자율 허용
auto_commands: ["ls", "cat", "echo", "pwd", "head", "tail", "grep", "mkdir", "touch", "wc"]   # python은 코드 검사를 거치지 않으므로 자율 허용 금지(기본 ask)

# 코드(AST) 검사용
allowed_modules: [pandas, numpy, math, statistics, json, csv, datetime, re, collections, itertools]   # 허용 목록: 이 외 모듈은 전부 차단
blocked_calls: [eval, exec, compile, __import__, getattr, setattr, globals, locals]
blocked_attrs: [environ, getenv, putenv, os, sys, subprocess, builtins, __globals__, __builtins__, __subclasses__, __mro__, __bases__, __class__, __dict__]
file_readers: [open, read_csv, read_excel, read_json, load, loadtxt, genfromtxt, read_table, read_parquet, to_csv, to_excel, to_json, save, savetxt]
path_kwargs: [file, filepath_or_buffer, path, fname, io, path_or_buf]
blocked_values: [open, eval, exec, compile, input, breakpoint]   # 값으로 참조(f = open)하면 차단   # 첫 인자가 경로인 함수들
